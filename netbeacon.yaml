server:
  host: "0.0.0.0"
  port: 8080

settings:
  check_interval_seconds: 30
  timeout_seconds: 5

targets:
  - name: "Google DNS"
    type: "tcp"
    host: "8.8.8.8"
    port: 53

  - name: "Cloudflare"
    type: "http"
    url: "https://1.1.1.1"
    expected_status: 200

  - name: "GitHub Status"
    type: "http"
    url: "https://www.githubstatus.com"
    expected_status: 200

alerts:
  webhook_url: ""
